---
- name: Set credentials to access Zabbix Server API
  ansible.builtin.set_fact:
    ansible_user: Admin
    ansible_httpapi_pass: zabbix
    ansible_network_os: zabbix.zabbix.zabbix
    ansible_connection: httpapi

# apiinfo.version does not require authentication.
# zabbix_version is the major version (6, 7, 8) used by "zabbix_version | int >= 7" conditions,
# zabbix_api_version is the full version for "zabbix_api_version is version('8.0', '>=')".
- name: 'Variables: Set Zabbix version'
  block:
    - name: Get Zabbix API version
      ansible.builtin.uri:
        url: "http://{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ ansible_httpapi_port | default(80) }}/api_jsonrpc.php"
        method: POST
        body_format: json
        body:
          jsonrpc: '2.0'
          method: apiinfo.version
          params: {}
          id: 1
      register: zabbix_apiinfo
      delegate_to: localhost

    - name: Set Zabbix version facts
      ansible.builtin.set_fact:
        zabbix_api_version: '{{ zabbix_apiinfo.json.result }}'
        zabbix_version: '{{ zabbix_apiinfo.json.result.split(".")[0] | int }}'

    - name: Assert that zabbix version is defined
      ansible.builtin.assert:
        quiet: true
        that:
          - zabbix_api_version is version('6.0', '>=')

- name: 'Variables: Generate PSK keys'
  block:
    - name: 'Variables: Generate PSK keys'
      ansible.builtin.set_fact:
        zabbix_psk_value: '{{ lookup("password", "/dev/null" + " chars=hexdigits length=64") | lower }}'
